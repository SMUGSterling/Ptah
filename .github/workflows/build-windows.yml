name: Build Windows

# Manual only: release.yml builds the installers for tagged releases. This
# used to run the full NSIS build on a Windows runner for every push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run dist:win

    - name: Upload Windows installers
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ptah-windows
        path: |
          dist/*.exe
          dist/*.blockmap
        if-no-files-found: error
