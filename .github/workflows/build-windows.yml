name: Build Windows

# Manual only: release.yml builds the installers for tagged releases. This
# used to run the full NSIS build on a Windows runner for every push to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false   # the token is not left in .git/config while npm ci runs install scripts

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run dist:win

    - name: Upload Windows installers
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ptah-windows
        path: |
          dist/*.exe
          dist/*.blockmap
        if-no-files-found: error
