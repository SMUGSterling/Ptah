name: Release desktop builds

# Tag a commit `vX.Y.Z` and this builds installers for all three platforms
# and attaches them to a GitHub Release. Signing is optional: without the
# secrets below the artifacts are unsigned (students will see SmartScreen /
# Gatekeeper warnings), with them they are signed and, on macOS, notarized.
#
#   Windows:  CSC_LINK (base64 .pfx or https URL), CSC_KEY_PASSWORD
#             or Azure Trusted Signing via win.azureSignOptions in package.json
#   macOS:    CSC_LINK, CSC_KEY_PASSWORD (Developer ID Application cert)
#             APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#
# Or run it by hand (Actions > Release desktop builds > Run workflow) with a
# `tag` such as v0.8.1: it builds the chosen branch, then creates that tag on
# the built commit and the Release. The tag must match package.json. Leave
# `tag` empty for a build-only run whose installers stay as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release (vX.Y.Z, must match package.json). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails fast on a bad or mismatched tag, before the 3 platform builds run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the tag against package.json
        id: tag
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          [ "$TAG" = "v$VERSION" ] || { echo "::error::tag $TAG does not match package.json $VERSION"; exit 1; }
          # gh release create reuses an existing tag and ignores --target, so a
          # manual run must not attach this build to a tag on another commit.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            refs=$(git ls-remote --tags origin "$TAG")
            at=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG^{}" '$2 == t { print $1 }')
            [ -n "$at" ] || at=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$TAG" '$2 == t { print $1 }')
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              echo "::error::tag $TAG already exists on $at, not on the built commit $GITHUB_SHA"; exit 1
            fi
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Build
        shell: bash
        # An unset secret arrives as an empty string, which electron-builder
        # reads as a path ("CSC_LINK ... not a file"): drop the empty ones.
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder skips signing when no certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ptah-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: [preflight, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Ptah $TAG" \
            --generate-notes
