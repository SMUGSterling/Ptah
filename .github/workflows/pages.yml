name: Deploy web build

# Publishes renderer/ to GitHub Pages. Students open the URL; no installer,
# no code signing, nothing to update on their machines.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/configure-pages@v6
      - name: Package the renderer as the site
        run: |
          rm -f renderer/package.json          # Node-only hint, not a web asset
          cp LICENSE renderer/LICENSE.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: renderer
      - id: deployment
        uses: actions/deploy-pages@v5
