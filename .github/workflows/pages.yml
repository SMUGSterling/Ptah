name: Deploy web build

# Publishes renderer/ to GitHub Pages. Students open the URL; no installer,
# no code signing, nothing to update on their machines.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the renderer as the site
        run: |
          rm -f renderer/package.json          # Node-only hint, not a web asset
          cp LICENSE renderer/LICENSE.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: renderer
      - id: deployment
        uses: actions/deploy-pages@v4
